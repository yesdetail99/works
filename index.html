<script>
    // ランダムで表示させたい写真のリスト
    const bgImages = [
      'images/iphone02.jpg',
      'images/lost.jpg',
      'images/spoil01.jpg',
      'images/umlaut01.jpg'
    ];

    // ランダムに1つ選択
    const randomImage = bgImages[Math.floor(Math.random() * bgImages.length)];

    // 背景画像を設定し、同時に「繰り返さない」「全体に拡大」を強制適用する
    document.body.style.backgroundImage = "url('" + randomImage + "')";
    document.body.style.backgroundRepeat = "no-repeat";        /* タイル状に繰り返さない */
    document.body.style.backgroundSize = "cover";              /* 画面全体を覆うように拡大 */
    document.body.style.backgroundPosition = "center center";  /* 中央寄背 */
    document.body.style.backgroundAttachment = "fixed";        /* 画面に固定 */
  </script>


</body>
